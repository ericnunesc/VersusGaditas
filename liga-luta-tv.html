<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placar TV — Liga BJJ</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --c1: #3B82F6;    /* azul – lado 1 */
      --c2: #EF4444;    /* vermelho – lado 2 */
      --gold: #C9A03D;
      --bg: #060A10;
      --bg2: #0D1520;
      --border: #1E293B;
      --muted: #64748B;
      --text: #E2E8F0;
    }
    html, body { height:100%; overflow:hidden; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* ─── TOP BAR ─────────────────────────────────────────────── */
    .top-bar {
      background: var(--bg2);
      border-bottom: 2px solid var(--gold);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .top-info { display:flex; flex-direction:column; gap:2px; }
    .top-cat {
      font-size: 1.5rem; font-weight: 900; letter-spacing: 3px;
      color: var(--gold); text-transform: uppercase;
    }
    .top-meta { font-size: 0.72rem; color: var(--muted); letter-spacing: 1px; }
    .top-btns { display:flex; gap:8px; }

    /* ─── MAIN GRID ───────────────────────────────────────────── */
    .fight-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 200px 1fr;
      min-height: 0;
    }

    /* ─── SIDE ────────────────────────────────────────────────── */
    .side {
      padding: 16px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      overflow-y: auto;
    }
    .side-1 { border-right: 1px solid var(--border); background: rgba(59,130,246,0.04); }
    .side-2 { border-left:  1px solid var(--border); background: rgba(239,68,68,0.04); }

    .side-badge {
      font-size: 0.6rem; font-weight: 800; letter-spacing: 2px;
      padding: 3px 12px; border-radius: 20px; text-transform: uppercase;
    }
    .side-1 .side-badge { background:rgba(59,130,246,0.15); color:var(--c1); }
    .side-2 .side-badge { background:rgba(239,68,68,0.15);  color:var(--c2); }

    .team-name {
      font-size: 0.85rem; font-weight: 800; text-align:center;
      color: var(--muted); text-transform:uppercase; letter-spacing:1px;
    }
    .athlete-name {
      font-size: 1.6rem; font-weight: 900; text-align:center; line-height:1.1;
      max-width: 100%;
    }
    .side-1 .athlete-name { color: #93C5FD; }
    .side-2 .athlete-name { color: #FCA5A5; }

    .leading-badge {
      font-size: 0.62rem; font-weight: 800; letter-spacing: 1px;
      padding: 2px 10px; border-radius: 20px; text-transform: uppercase;
      background: rgba(201,160,61,0.15); border: 1px solid rgba(201,160,61,0.35);
      color: var(--gold); height: 20px;
    }
    .leading-badge.invisible { opacity:0; pointer-events:none; }

    /* Big score */
    .score-num {
      font-size: clamp(7rem, 20vw, 16rem);
      font-weight: 900; line-height: 1;
      font-variant-numeric: tabular-nums;
      transition: color 0.3s;
    }
    .side-1 .score-num { color: var(--c1); }
    .side-2 .score-num { color: var(--c2); }
    .score-num.leading {
      filter: drop-shadow(0 0 24px currentColor);
    }

    /* Van / Pun */
    .score-sub {
      display:flex; gap:20px;
    }
    .sub-item { text-align:center; }
    .sub-lbl { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:2px; }
    .sub-num { font-size:1.6rem; font-weight:800; }
    .van-num { color:#22C55E; }
    .pun-num { color:#F59E0B; }

    /* Scoring buttons */
    .btns-wrap {
      display:flex; flex-direction:column; gap:6px; width:100%; max-width:260px;
    }
    .btn-s {
      padding:11px 10px; border:none; border-radius:10px; cursor:pointer;
      font-size:0.85rem; font-weight:700; transition:transform 0.1s, filter 0.15s;
      text-align:center;
    }
    .btn-s:active { transform:scale(0.93); }
    .btn-s.b2  { background:#1D4ED8; color:#fff; }
    .btn-s.b2:hover { filter:brightness(1.2); }
    .btn-s.b3  { background:#7C3AED; color:#fff; }
    .btn-s.b3:hover { filter:brightness(1.2); }
    .btn-s.b4  { background:#0E7490; color:#fff; }
    .btn-s.b4:hover { filter:brightness(1.2); }
    .btn-s.bv  { background:#166534; color:#fff; }
    .btn-s.bv:hover { filter:brightness(1.2); }
    .btn-s.bp  { background:#78350F; color:#fff; }
    .btn-s.bp:hover { filter:brightness(1.2); }
    .btn-s.bsub { background:#991B1B; color:#fff; font-size:0.9rem; font-weight:800; }
    .btn-s.bsub:hover { filter:brightness(1.2); }
    .btn-s.bundo { background:transparent; border:1px solid var(--border); color:var(--muted); font-size:0.65rem; padding:7px 6px; }
    .btn-s.bundo:hover { border-color:#64748B; color:var(--text); }
    .undo-row { display:flex; gap:5px; width:100%; max-width:260px; }

    /* ─── CENTER (timer) ──────────────────────────────────────── */
    .center-col {
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      gap:10px; padding:20px 10px;
    }
    .vs-txt { font-size:0.55rem; color:var(--border); font-weight:800; letter-spacing:3px; }
    .timer-display {
      font-size:clamp(2.8rem, 5vw, 4rem);
      font-weight:900; color:var(--gold);
      font-variant-numeric:tabular-nums; font-family:monospace;
      text-align:center; line-height:1; width:140px; text-align:center;
    }
    .timer-display.urgent { color:#EF4444; animation:urgblink 0.6s infinite; }
    @keyframes urgblink { 0%,100%{opacity:1} 50%{opacity:0.45} }

    .btn-timer-start {
      width:100%; padding:10px 0; border-radius:10px;
      background:var(--bg2); border:2px solid var(--border); color:var(--text);
      font-size:0.82rem; font-weight:700; cursor:pointer; transition:all 0.2s;
    }
    .btn-timer-start:hover { border-color:var(--c1); color:var(--c1); }
    .btn-timer-start.running { border-color:var(--c2); color:var(--c2); }
    .btn-timer-reset {
      width:100%; padding:6px 0; border-radius:8px;
      background:transparent; border:1px solid var(--border); color:var(--muted);
      font-size:0.72rem; font-weight:700; cursor:pointer; transition:all 0.2s;
    }
    .btn-timer-reset:hover { border-color:#F59E0B; color:#F59E0B; }

    /* ─── BOTTOM BAR ──────────────────────────────────────────── */
    .bottom-bar {
      background:var(--bg2); border-top:1px solid var(--border);
      padding:10px 18px; display:flex; align-items:center;
      justify-content:center; gap:10px; flex-wrap:wrap; flex-shrink:0;
    }
    .decl-lbl { font-size:0.68rem; color:var(--muted); font-weight:700; letter-spacing:1px; }
    .decl-btn {
      padding:9px 18px; border-radius:10px; border:2px solid var(--border);
      background:var(--bg2); color:var(--muted); font-size:0.82rem; font-weight:700;
      cursor:pointer; transition:all 0.2s;
    }
    .decl-btn:hover { border-color:var(--gold); color:var(--gold); }
    .decl-btn.sel-1   { background:rgba(59,130,246,0.2);  border-color:var(--c1); color:#93C5FD; }
    .decl-btn.sel-2   { background:rgba(239,68,68,0.2);   border-color:var(--c2); color:#FCA5A5; }
    .decl-btn.sel-emp { background:rgba(245,158,11,0.2);  border-color:#F59E0B;   color:#FDE68A; }
    .fin-lbl {
      display:flex; align-items:center; gap:6px; font-size:0.78rem; color:var(--muted);
      cursor:pointer; padding:8px 12px; border:1px solid var(--border); border-radius:8px;
    }
    .fin-lbl input { accent-color:var(--gold); width:15px; height:15px; }
    .sep { width:1px; height:28px; background:var(--border); flex-shrink:0; }

    /* ─── ACTION BUTTONS ──────────────────────────────────────── */
    .btn-enc {
      background:transparent; border:1px solid var(--c2); color:var(--c2);
      padding:9px 16px; border-radius:10px; font-size:0.82rem; font-weight:700; cursor:pointer;
      transition:all 0.2s;
    }
    .btn-enc:hover { background:var(--c2); color:#fff; }
    .btn-fin {
      background:#059669; color:#fff; border:none;
      padding:9px 20px; border-radius:10px; font-size:0.88rem; font-weight:800; cursor:pointer;
      transition:all 0.2s;
    }
    .btn-fin:hover { background:#10B981; }

    /* ─── TOAST ───────────────────────────────────────────────── */
    #toast-box {
      position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
      display:flex; flex-direction:column; align-items:center; gap:6px; z-index:99;
      pointer-events:none;
    }
    .toast-msg {
      background:#1E293B; border:1px solid #334155; color:var(--text);
      padding:8px 18px; border-radius:8px; font-size:0.83rem; font-weight:600;
      animation:slideUp 0.25s ease;
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    /* ─── OVERLAY (sem dados) ─────────────────────────────────── */
    #overlay {
      position:fixed; inset:0; background:var(--bg);
      display:flex; align-items:center; justify-content:center;
      font-size:1.1rem; color:var(--muted); z-index:50;
    }
  </style>
</head>
<body>

<div id="overlay">⏳ Aguardando dados da luta…</div>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-info">
    <div class="top-cat" id="top-cat">—</div>
    <div class="top-meta" id="top-meta">—</div>
  </div>
  <div class="top-btns">
    <button class="btn-enc" onclick="encerrar()">⏹ Encerrar</button>
    <button class="btn-fin" onclick="finalizar()">✅ Finalizar Luta</button>
  </div>
</div>

<!-- FIGHT GRID -->
<div class="fight-grid">

  <!-- SIDE 1 -->
  <div class="side side-1">
    <div class="side-badge">🔵 CASA</div>
    <div class="team-name"  id="team1">—</div>
    <div class="athlete-name" id="at1">—</div>
    <div class="leading-badge invisible" id="lead1">▲ LIDERANDO</div>
    <div class="score-num" id="pts1-big">0</div>
    <div class="score-sub">
      <div class="sub-item">
        <div class="sub-lbl">Van</div>
        <div class="sub-num van-num" id="van1-d">0</div>
      </div>
      <div class="sub-item">
        <div class="sub-lbl">Pun</div>
        <div class="sub-num pun-num" id="pun1-d">0</div>
      </div>
    </div>
    <div class="btns-wrap">
      <button class="btn-s b2"  onclick="addPts(1,2)">+2 Derrubada</button>
      <button class="btn-s b3"  onclick="addPts(1,3)">+3 Passagem de Guarda</button>
      <button class="btn-s b4"  onclick="addPts(1,4)">+4 Montada / Costas</button>
      <button class="btn-s bv"  onclick="addVan(1)">+1 Vantagem</button>
      <button class="btn-s bp"  onclick="addPun(1)">⚠️ Punição</button>
      <button class="btn-s bsub" onclick="submissao(1)">🔒 Submissão / Finalização</button>
      <div class="undo-row">
        <button class="btn-s bundo" style="flex:1" onclick="undoPts(1)">↩ pts</button>
        <button class="btn-s bundo" style="flex:1" onclick="undoVan(1)">↩ van</button>
        <button class="btn-s bundo" style="flex:1" onclick="undoPun(1)">↩ pun</button>
      </div>
    </div>
  </div>

  <!-- CENTER -->
  <div class="center-col">
    <div class="vs-txt">VS</div>
    <div class="timer-display" id="timer-d">05:00</div>
    <button class="btn-timer-start" id="btn-timer" onclick="toggleTimer()">▶ Iniciar</button>
    <button class="btn-timer-reset" onclick="resetTimer()">↺ Zerar</button>
  </div>

  <!-- SIDE 2 -->
  <div class="side side-2">
    <div class="side-badge">🔴 VISIT.</div>
    <div class="team-name"   id="team2">—</div>
    <div class="athlete-name" id="at2">—</div>
    <div class="leading-badge invisible" id="lead2">▲ LIDERANDO</div>
    <div class="score-num" id="pts2-big">0</div>
    <div class="score-sub">
      <div class="sub-item">
        <div class="sub-lbl">Van</div>
        <div class="sub-num van-num" id="van2-d">0</div>
      </div>
      <div class="sub-item">
        <div class="sub-lbl">Pun</div>
        <div class="sub-num pun-num" id="pun2-d">0</div>
      </div>
    </div>
    <div class="btns-wrap">
      <button class="btn-s b2"  onclick="addPts(2,2)">+2 Derrubada</button>
      <button class="btn-s b3"  onclick="addPts(2,3)">+3 Passagem de Guarda</button>
      <button class="btn-s b4"  onclick="addPts(2,4)">+4 Montada / Costas</button>
      <button class="btn-s bv"  onclick="addVan(2)">+1 Vantagem</button>
      <button class="btn-s bp"  onclick="addPun(2)">⚠️ Punição</button>
      <button class="btn-s bsub" onclick="submissao(2)">🔒 Submissão / Finalização</button>
      <div class="undo-row">
        <button class="btn-s bundo" style="flex:1" onclick="undoPts(2)">↩ pts</button>
        <button class="btn-s bundo" style="flex:1" onclick="undoVan(2)">↩ van</button>
        <button class="btn-s bundo" style="flex:1" onclick="undoPun(2)">↩ pun</button>
      </div>
    </div>
  </div>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <span class="decl-lbl">🏆 VENCEDOR:</span>
  <button class="decl-btn" id="decl-1"   onclick="declararVenc('1')">
    🏆 <span id="decl-n1">—</span>
  </button>
  <button class="decl-btn" id="decl-emp" onclick="declararVenc('empate')">🤝 Empate</button>
  <button class="decl-btn" id="decl-2"   onclick="declararVenc('2')">
    🏆 <span id="decl-n2">—</span>
  </button>
  <div class="sep"></div>
  <label class="fin-lbl">
    <input type="checkbox" id="fin-chk"> 🔒 Finalização / Sub.
  </label>
</div>

<div id="toast-box"></div>

<script>
// ── Init ───────────────────────────────────────────────────────
const urlP  = new URLSearchParams(location.search);
const campId = urlP.get('id');
const idx    = parseInt(urlP.get('idx'));

let initData = null;
let sc = { pts1:0, pts2:0, van1:0, van2:0, pun1:0, pun2:0 };
let vencedor   = null;
let finalizacao = false;
let lastPts    = []; // [{side,val}] — undo stack

let timerSecs    = 300;
let timerRunning = false;
let timerInt     = null;

// BroadcastChannel — same key used in liga-placar-adm.html
const ch = new BroadcastChannel(`liga_luta_${campId}`);

// ── Load data ──────────────────────────────────────────────────
function tryLoad() {
  const raw = localStorage.getItem(`liga_luta_init_${campId}_${idx}`);
  if (!raw) return false;
  initData = JSON.parse(raw);
  timerSecs = initData.tempoLuta || 300;

  document.getElementById('overlay').style.display = 'none';
  document.getElementById('top-cat').textContent  = initData.categoria || '—';
  document.getElementById('top-meta').textContent =
    `${initData.faixaLabel || ''} · R${initData.rodada||''} · ${initData.equipe1||''} × ${initData.equipe2||''}`;
  document.getElementById('team1').textContent = initData.equipe1 || '—';
  document.getElementById('team2').textContent = initData.equipe2 || '—';
  document.getElementById('at1').textContent   = initData.atleta1 || '—';
  document.getElementById('at2').textContent   = initData.atleta2 || '—';

  const n1 = (initData.atleta1 || initData.equipe1 || '?').split(' ')[0];
  const n2 = (initData.atleta2 || initData.equipe2 || '?').split(' ')[0];
  document.getElementById('decl-n1').textContent = n1;
  document.getElementById('decl-n2').textContent = n2;

  updateTimerDisplay();
  return true;
}

// Try immediately; if not yet written, poll briefly
if (!tryLoad()) {
  const t = setInterval(() => { if (tryLoad()) clearInterval(t); }, 200);
  setTimeout(() => clearInterval(t), 4000);
}

// Listen for "fechar" from main page
ch.addEventListener('message', e => {
  if (e.data?.type === 'fechar') window.close();
});

// ── Timer ──────────────────────────────────────────────────────
function updateTimerDisplay() {
  const m = Math.floor(timerSecs / 60);
  const s = timerSecs % 60;
  const el = document.getElementById('timer-d');
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.classList.toggle('urgent', timerSecs > 0 && timerSecs <= 30);
}

function toggleTimer() {
  const btn = document.getElementById('btn-timer');
  if (timerRunning) {
    clearInterval(timerInt); timerInt = null; timerRunning = false;
    btn.textContent = '▶ Iniciar'; btn.classList.remove('running');
  } else {
    timerRunning = true;
    btn.textContent = '⏸ Pausar'; btn.classList.add('running');
    timerInt = setInterval(() => {
      if (timerSecs <= 0) {
        clearInterval(timerInt); timerInt = null; timerRunning = false;
        document.getElementById('btn-timer').textContent = '▶ Iniciar';
        document.getElementById('btn-timer').classList.remove('running');
        toast('⏰ Tempo esgotado!');
        return;
      }
      timerSecs--;
      updateTimerDisplay();
    }, 1000);
  }
}

function resetTimer() {
  clearInterval(timerInt); timerInt = null; timerRunning = false;
  timerSecs = initData?.tempoLuta || 300;
  const btn = document.getElementById('btn-timer');
  btn.textContent = '▶ Iniciar'; btn.classList.remove('running');
  updateTimerDisplay();
}

// ── Scoring ────────────────────────────────────────────────────
function addPts(side, val) {
  sc[`pts${side}`] += val;
  lastPts.push({ side, val });
  if (lastPts.length > 8) lastPts.shift();
  updateUI();
  broadcastScore();
}

function undoPts(side) {
  for (let i = lastPts.length - 1; i >= 0; i--) {
    if (lastPts[i].side === side) {
      sc[`pts${side}`] = Math.max(0, sc[`pts${side}`] - lastPts[i].val);
      lastPts.splice(i, 1);
      updateUI();
      broadcastScore();
      return;
    }
  }
  toast('Nada para desfazer.');
}

function addVan(side) {
  sc[`van${side}`]++;
  updateUI();
  broadcastScore();
}

function addPun(side) {
  const adv = side === 1 ? 2 : 1;
  const newPun = ++sc[`pun${side}`];
  const nAdv = nome(adv);

  if (newPun === 2) {
    sc[`van${adv}`]++;
    toast(`⚠️ 2ª Punição: +1 van para ${nAdv}!`);
  } else if (newPun === 3) {
    sc[`pts${adv}`] += 2;
    toast(`⚡ 3ª Punição: +2 pts para ${nAdv}!`);
  } else if (newPun >= 4) {
    toast(`⛔ 4ª Punição — DQ! Clique em 🏆 ${nAdv} e Finalizar.`);
  }
  updateUI();
  broadcastScore();
}

function undoVan(side) {
  if (sc[`van${side}`] <= 0) { toast('Vantagem já está em 0.'); return; }
  sc[`van${side}`]--;
  updateUI();
  broadcastScore();
}

function undoPun(side) {
  const cur = sc[`pun${side}`];
  if (cur <= 0) { toast('Punição já está em 0.'); return; }
  const adv = side === 1 ? 2 : 1;
  const nAdv = nome(adv);
  // Reverter efeito automático
  if (cur === 2) {
    // A 2ª punição tinha dado +1 van ao adversário — devolver
    sc[`van${adv}`] = Math.max(0, sc[`van${adv}`] - 1);
    toast(`↩ Correção: −1 van de ${nAdv} (2ª punição removida)`);
  } else if (cur === 3) {
    // A 3ª punição tinha dado +2 pts ao adversário — devolver
    sc[`pts${adv}`] = Math.max(0, sc[`pts${adv}`] - 2);
    toast(`↩ Correção: −2 pts de ${nAdv} (3ª punição removida)`);
  }
  sc[`pun${side}`]--;
  updateUI();
  broadcastScore();
}

function submissao(side) {
  vencedor = String(side);
  finalizacao = true;
  document.getElementById('fin-chk').checked = true;
  clearInterval(timerInt); timerInt = null; timerRunning = false;
  const btn = document.getElementById('btn-timer');
  btn.textContent = '▶ Iniciar'; btn.classList.remove('running');
  updateUI();
  toast('🔒 Submissão! Confirme o vencedor e clique em Finalizar Luta.');
}

function declararVenc(v) {
  vencedor = v;
  updateUI();
}

function nome(side) {
  const n = side === 1
    ? initData?.atleta1 || initData?.equipe1
    : initData?.atleta2 || initData?.equipe2;
  return (n || '?').split(' ')[0];
}

// ── UI update ──────────────────────────────────────────────────
function updateUI() {
  document.getElementById('pts1-big').textContent = sc.pts1;
  document.getElementById('pts2-big').textContent = sc.pts2;
  document.getElementById('van1-d').textContent   = sc.van1;
  document.getElementById('van2-d').textContent   = sc.van2;
  document.getElementById('pun1-d').textContent   = sc.pun1;
  document.getElementById('pun2-d').textContent   = sc.pun2;

  const lead = calcLead();
  const p1 = document.getElementById('pts1-big');
  const p2 = document.getElementById('pts2-big');
  const l1 = document.getElementById('lead1');
  const l2 = document.getElementById('lead2');
  p1.classList.toggle('leading', lead === '1');
  p2.classList.toggle('leading', lead === '2');
  l1.classList.toggle('invisible', lead !== '1');
  l2.classList.toggle('invisible', lead !== '2');

  // winner buttons
  ['decl-1','decl-emp','decl-2'].forEach(id => {
    document.getElementById(id)?.classList.remove('sel-1','sel-emp','sel-2');
  });
  if (vencedor === '1')      document.getElementById('decl-1').classList.add('sel-1');
  else if (vencedor === '2') document.getElementById('decl-2').classList.add('sel-2');
  else if (vencedor === 'empate') document.getElementById('decl-emp').classList.add('sel-emp');
}

function calcLead() {
  if (vencedor) return vencedor === 'empate' ? null : vencedor;
  if (sc.pts1 > sc.pts2) return '1';
  if (sc.pts2 > sc.pts1) return '2';
  if (sc.van1 > sc.van2) return '1';
  if (sc.van2 > sc.van1) return '2';
  if (sc.pun1 < sc.pun2) return '1';
  if (sc.pun2 < sc.pun1) return '2';
  return null;
}

function broadcastScore() {
  ch.postMessage({ type:'tv_score', idx, state:{ ...sc } });
}

// ── Finalizar / Encerrar ───────────────────────────────────────
function finalizar() {
  finalizacao = document.getElementById('fin-chk').checked;
  let v = vencedor;
  if (!v) {
    v = calcLead();
    if (!v) { toast('Selecione o vencedor antes de finalizar!'); return; }
    vencedor = v;
  }
  clearInterval(timerInt);
  ch.postMessage({
    type: 'tv_finalizar',
    idx,
    state: { ...sc, vencedor: v, finalizacao }
  });
  setTimeout(() => window.close(), 600);
}

function encerrar() {
  if (!confirm('Encerrar esta luta?\nO confronto voltará ao status Pendente.')) return;
  clearInterval(timerInt);
  ch.postMessage({ type:'tv_encerrar', idx });
  window.close();
}

// ── Toast ──────────────────────────────────────────────────────
function toast(msg) {
  const box = document.getElementById('toast-box');
  const el  = document.createElement('div');
  el.className = 'toast-msg';
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
</script>
