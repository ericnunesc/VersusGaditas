<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="images/logo_favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classificação — Liga BJJ</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',-apple-system,sans-serif;background:#F5F7FA;color:#1A2C3E;min-height:100vh;}

    header{background:#1A2C3E;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
    .hdr-logo{font-size:1.5rem;}
    .hdr-info h1{font-size:0.92rem;font-weight:700;}
    .hdr-info p{font-size:0.62rem;color:#8A9CB0;margin-top:1px;}

    .app{max-width:960px;margin:0 auto;padding:20px 14px 60px;}

    /* Faixa tabs */
    .faixa-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
    .faixa-btn{padding:7px 16px;border-radius:20px;border:2px solid #E2E8F0;background:#fff;cursor:pointer;font-size:0.78rem;font-weight:600;transition:all 0.2s;color:#1A2C3E;}
    .faixa-btn[data-f="branca"].active{border-color:#6B7280;background:#6B7280;color:#fff;}
    .faixa-btn[data-f="azul"].active{border-color:#3B8BFF;background:#3B8BFF;color:#fff;}
    .faixa-btn[data-f="roxa"].active{border-color:#9B59B6;background:#9B59B6;color:#fff;}
    .faixa-btn[data-f="marrom"].active{border-color:#92400E;background:#92400E;color:#fff;}
    .faixa-btn[data-f="preta"].active{border-color:#374151;background:#374151;color:#fff;}

    .card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:18px;margin-bottom:16px;}
    .card-header{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
    .card-header h3{font-size:0.9rem;font-weight:700;}

    .tbl-wrap{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;font-size:0.78rem;}
    thead tr{border-bottom:2px solid #E2E8F0;}
    th{padding:7px 10px;text-align:left;font-size:0.65rem;font-weight:700;color:#8A9CB0;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;}
    td{padding:9px 10px;border-bottom:1px solid #F8FAFC;vertical-align:middle;}
    tr:last-child td{border-bottom:none;}
    tr:hover td{background:#FAFBFC;}

    .eq-logo{height:26px;width:26px;object-fit:contain;border-radius:4px;vertical-align:middle;margin-right:7px;}
    .eq-logo-ph{display:inline-flex;width:26px;height:26px;background:#F1F5F9;border-radius:4px;align-items:center;justify-content:center;font-size:0.75rem;vertical-align:middle;margin-right:7px;}
    .atleta-foto{width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid #E2E8F0;vertical-align:middle;margin-right:7px;}
    .atleta-avatar{display:inline-flex;width:28px;height:28px;border-radius:50%;background:#F1F5F9;border:2px solid #E2E8F0;align-items:center;justify-content:center;font-size:0.75rem;vertical-align:middle;margin-right:7px;}

    .medal{font-size:1rem;}
    .pts{color:#C9A03D;font-weight:800;font-size:1rem;}
    .v{color:#10B981;font-weight:700;}
    .e{color:#F59E0B;font-weight:700;}
    .d{color:#EF4444;font-weight:700;}

    .cat-section{margin-bottom:16px;}
    .cat-title{font-size:0.68rem;font-weight:700;color:#8A9CB0;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid #F1F5F9;}

    .progress-bar{background:#F1F5F9;border-radius:20px;height:5px;width:80px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:5px;}
    .progress-fill{background:#C9A03D;height:100%;border-radius:20px;}

    .vazio{text-align:center;padding:40px 20px;color:#8A9CB0;}
    .vazio span{font-size:2.5rem;display:block;margin-bottom:10px;opacity:0.3;}

    .live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#10B981;margin-right:5px;animation:pulse 1.5s infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

    .badge-liga{background:rgba(201,160,61,0.15);border:1px solid #C9A03D;color:#C9A03D;padding:3px 10px;border-radius:20px;font-size:0.65rem;font-weight:700;}

    .top-banner{background:linear-gradient(135deg,#1A2C3E,#2A4060);color:#fff;border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
    .top-banner h2{font-size:1rem;font-weight:800;}
    .top-banner p{font-size:0.7rem;color:#8A9CB0;margin-top:2px;}

    /* Responsivo */
    .desktop-only{display:block;}
    .mobile-only{display:none;}

    /* Cards mobile — equipes */
    .rank-card{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #F1F5F9;}
    .rank-card:last-child{border-bottom:none;}
    .rank-pos{width:26px;text-align:center;font-size:1rem;flex-shrink:0;padding-top:2px;}
    .rank-body{flex:1;min-width:0;}
    .rank-name{font-weight:700;font-size:0.9rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
    .rank-name-pts{margin-left:auto;font-size:1rem;font-weight:800;color:#C9A03D;white-space:nowrap;}
    .rank-city{font-size:0.65rem;color:#8A9CB0;margin-top:2px;}
    .rank-stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px;}
    .rs{display:flex;flex-direction:column;align-items:center;gap:1px;}
    .rs-lbl{font-size:0.58rem;color:#8A9CB0;font-weight:700;text-transform:uppercase;}
    .rs-val{font-size:0.82rem;font-weight:700;}
    .aprov-bar{flex:1;display:flex;align-items:center;gap:6px;margin-top:7px;}
    .aprov-track{flex:1;background:#F1F5F9;border-radius:20px;height:5px;overflow:hidden;}
    .aprov-fill{background:#C9A03D;height:100%;border-radius:20px;}
    .aprov-pct{font-size:0.7rem;font-weight:700;color:#8A9CB0;white-space:nowrap;}

    /* Cards mobile — atletas */
    .at-card{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #F1F5F9;}
    .at-card:last-child{border-bottom:none;}
    .at-pos{width:26px;text-align:center;font-size:0.9rem;flex-shrink:0;padding-top:3px;}
    .at-body{flex:1;min-width:0;}
    .at-name-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
    .at-nome{font-weight:700;font-size:0.88rem;}
    .at-pts-badge{margin-left:auto;background:#FEF9C3;color:#92400E;font-size:0.75rem;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap;}
    .at-eq{font-size:0.65rem;color:#8A9CB0;margin-top:2px;}
    .at-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

    @media(max-width:600px){
      .desktop-only{display:none;}
      .mobile-only{display:block;}
    }

    /* ── Bracket / Finais ── */
    .fase-title{display:flex;align-items:center;gap:10px;margin:6px 0 12px;}
    .fase-title-line{flex:1;height:1px;background:linear-gradient(to right,#C9A03D55,transparent);}
    .fase-title-line.rev{background:linear-gradient(to left,#C9A03D55,transparent);}
    .fase-title-text{font-size:0.65rem;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:#C9A03D;}
    .round-label{font-size:0.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#8A9CB0;padding-bottom:6px;border-bottom:1px solid #F1F5F9;margin-bottom:8px;}

    .match-card{border:1.5px solid #E2E8F0;border-radius:13px;background:#FAFAFA;overflow:hidden;margin-bottom:10px;}
    .match-card.pendente{border-color:#C9A03D;background:#FFFDF8;}
    .match-card.concluido{border-color:#D1D5DB;background:#F9FAFB;}
    .match-row{display:flex;align-items:center;gap:9px;padding:11px 14px;}
    .match-row.winner{background:linear-gradient(90deg,#FFF8E8,#FFFDF5);}
    .match-vs{display:flex;align-items:center;gap:8px;background:#F8FAFC;border-top:1px solid #F1F5F9;border-bottom:1px solid #F1F5F9;padding:5px 14px;}
    .match-vs-line{flex:1;height:1px;background:#E2E8F0;}
    .match-vs-txt{font-size:0.58rem;font-weight:800;color:#94A3B8;letter-spacing:.8px;}
    .match-vs-badge{font-size:0.58rem;font-weight:700;border-radius:20px;padding:2px 8px;}
    .match-vs-badge.done{color:#16A34A;background:#DCFCE7;}
    .match-vs-badge.pend{color:#C9A03D;background:#FFF8E8;}
    .match-vs-badge.wait{color:#94A3B8;background:#F1F5F9;}
    .match-vs-badge.final{color:#C9A03D;background:#FFF8E8;}
    .match-name{font-size:0.83rem;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .match-name.winner-text{color:#B8860B;}
    .match-name.wait-text{color:#94A3B8;font-style:italic;font-weight:400;}
    .match-seed{min-width:22px;height:22px;border-radius:11px;background:#C9A03D;color:#fff;font-size:0.58rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;padding:0 5px;}
    .match-check{background:#C9A03D;color:#fff;border-radius:20px;padding:2px 9px;font-size:0.6rem;font-weight:800;flex-shrink:0;}
    .match-check-ph{width:52px;flex-shrink:0;}

    .champ-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:18px;}
    .champ-card{text-align:center;padding:12px 8px;background:linear-gradient(135deg,#FFFDF8,#FFF8E8);border:1.5px solid #C9A03D44;border-radius:12px;}
    .champ-foto{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #C9A03D;margin-bottom:6px;}
    .champ-foto-ph{width:44px;height:44px;border-radius:50%;background:#FFF8E8;border:2px solid #C9A03D;display:flex;align-items:center;justify-content:center;font-size:1.2rem;margin:0 auto 6px;}
    .champ-cat{font-size:0.58rem;font-weight:800;letter-spacing:1px;color:#C9A03D;text-transform:uppercase;}
    .champ-nome{font-size:0.75rem;font-weight:700;color:#1A2C3E;margin-top:2px;line-height:1.2;}
    .champ-eq{font-size:0.62rem;color:#8A9CB0;margin-top:2px;}

    .champ-equipe-card{text-align:center;padding:18px 16px;background:linear-gradient(135deg,#FFF8E8,#FFF3CC);border-radius:14px;border:2px solid #C9A03D;margin-bottom:20px;box-shadow:0 2px 12px #C9A03D22;}
    .champ-equipe-logo{width:60px;height:60px;object-fit:contain;border-radius:12px;margin-bottom:8px;box-shadow:0 2px 8px #C9A03D44;}
    .champ-equipe-logo-ph{font-size:2.5rem;margin-bottom:8px;}
    .champ-equipe-label{font-size:0.6rem;font-weight:800;letter-spacing:2px;color:#C9A03D;text-transform:uppercase;margin-bottom:4px;}
    .champ-equipe-nome{font-size:1.15rem;font-weight:800;color:#1A2C3E;}
  </style>
</head>
<body>

<header>
  <div class="hdr-logo">🥋</div>
  <div class="hdr-info">
    <h1 id="hdr-titulo">Classificação — Liga BJJ</h1>
    <p><span class="live-dot"></span>Atualização automática em tempo real</p>
  </div>
</header>

<div class="app">
  <div class="top-banner">
    <div>
      <h2 id="banner-nome">Liga BJJ</h2>
      <p id="banner-sub">Classificação geral · Atualizado em tempo real</p>
    </div>
    <span class="badge-liga">⚽ Liga</span>
  </div>

  <div class="faixa-tabs" id="faixa-tabs"></div>
  <div id="classificacao-content">
    <div class="vazio"><span>⏳</span><p>Carregando classificação...</p></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const _cfg = {
  apiKey:"AIzaSyA0HOHKPd9gCpJx0pnFWaKdLU-1WJks-gA",
  authDomain:"campeonatobjj.firebaseapp.com",
  projectId:"campeonatobjj",
  storageBucket:"campeonatobjj.firebasestorage.app",
  messagingSenderId:"399016509024",
  appId:"1:399016509024:web:2963122de02b7ff3bc0d05"
};
const _db = getFirestore(initializeApp(_cfg, 'class-pub'));
const campeonatoId = new URLSearchParams(location.search).get('id');

const FAIXAS_LABEL = { branca:'⬜ Branca', azul:'🔵 Azul', roxa:'🟣 Roxa', marrom:'🟤 Marrom', preta:'⬛ Preta' };
const MEDALS = ['🥇','🥈','🥉'];

let estado = null;
let faixaAtiva = null;

function getCategorias() {
  return [...(estado.ligaConfig?.categorias || []),
          ...(estado.ligaConfig?.temAbsoluto ? ['Absoluto'] : [])];
}

function nomeEquipe(id) {
  return estado.equipes.find(e => e.id === id)?.nome || '?';
}

function getCapitaoAbsoluto(equipeId) {
  const eq = estado.equipes.find(e => e.id === equipeId);
  const capId = eq?.capitaes?.[faixaAtiva];
  return capId ? estado.atletas.find(a => a.id === capId) : null;
}

function calcularClassificacao(faixa) {
  const eqs = estado.equipes;
  const stats = {};
  eqs.forEach(e => { stats[e.id] = { equipe:e, j:0, v:0, emp:0, d:0, pts:0, cv:0 }; });
  for (const c of estado.confrontos.filter(x => x.faixa === faixa && x.status === 'concluido' && x.resultado && x.fase !== 'mata-mata' && x.fase !== 'final-individual')) {
    const s1 = stats[c.equipe1Id], s2 = stats[c.equipe2Id];
    if (!s1 || !s2) continue;
    const v1 = c.resultado.vitoriasEq1||0, v2 = c.resultado.vitoriasEq2||0;
    s1.j++; s2.j++;
    s1.cv += v1; s2.cv += v2;
    if (v1 > v2) { s1.v++; s1.pts += 3; s2.d++; }
    else if (v2 > v1) { s2.v++; s2.pts += 3; s1.d++; }
    else { s1.emp++; s2.emp++; s1.pts++; s2.pts++; }
  }
  return Object.values(stats).sort((a,b) => b.pts-a.pts||b.v-a.v||b.cv-a.cv);
}

function renderFaixaTabs() {
  const faixas = estado.ligaConfig?.faixasAtivas || ['branca'];
  const tabsEl = document.getElementById('faixa-tabs');
  tabsEl.innerHTML = faixas.map(f =>
    `<button class="faixa-btn${f===faixaAtiva?' active':''}" data-f="${f}" onclick="window._setFaixa('${f}')">${FAIXAS_LABEL[f]||f}</button>`
  ).join('');
}

window._setFaixa = function(f) {
  faixaAtiva = f;
  renderFaixaTabs();
  renderClassificacao();
};

// ── Helpers visuais ────────────────────────────────────────────
function eqLogo(eq, sz) {
  return eq?.logoBase64
    ? `<img src="${eq.logoBase64}" style="width:${sz}px;height:${sz}px;object-fit:contain;border-radius:${sz/4}px;flex-shrink:0;">`
    : `<div style="width:${sz}px;height:${sz}px;border-radius:${sz/4}px;background:#F1F5F9;display:flex;align-items:center;justify-content:center;font-size:${sz*0.5}px;flex-shrink:0;">🏅</div>`;
}
function atFoto(at, sz) {
  return at?.fotoBase64
    ? `<img src="${at.fotoBase64}" style="width:${sz}px;height:${sz}px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid #E2E8F0;">`
    : `<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:#F1F5F9;border:2px solid #E2E8F0;display:flex;align-items:center;justify-content:center;font-size:${sz*0.4}px;flex-shrink:0;">👤</div>`;
}
function faseTitle(txt) {
  return `<div class="fase-title"><div class="fase-title-line"></div><span class="fase-title-text">${txt}</span><div class="fase-title-line rev"></div></div>`;
}
function vsBadge(status) {
  if (status==='concluido') return `<span class="match-vs-badge done">✅ Finalizado</span>`;
  if (status==='pendente')  return `<span class="match-vs-badge pend">🟡 Pendente</span>`;
  return `<span class="match-vs-badge wait">⏳ Aguardando</span>`;
}
function seedPin(s) {
  return s ? `<span class="match-seed">${s}º</span>` : `<span style="width:22px;flex-shrink:0;display:inline-block;"></span>`;
}

// ── Render Mata-Mata (equipes) ─────────────────────────────────
function renderMataMata(faixa) {
  const mm = (estado.confrontos||[]).filter(c => c.faixa === faixa && c.fase === 'mata-mata' && c.metodo !== 'bye');
  if (!mm.length) return '';
  const maxR = Math.max(...mm.map(m => m.rodada));
  const nomeRodada = r => r===maxR?'🏆 Final':r===maxR-1?'🥊 Semifinal':r===maxR-2?'⚡ Quartas de Final':`🔹 Rodada ${r}`;
  const eqs = estado.equipes||[];
  let html = `<div class="card"><div class="card-header"><h3>🏅 Fase Mata-Mata por Equipes</h3></div>`;

  // Campeão
  const final = mm.find(m => m.rodada === maxR && m.posicao === 0);
  if (final?.status==='concluido' && final?.vencedorId) {
    const eq = eqs.find(e => e.id === final.vencedorId);
    const logo = eq?.logoBase64
      ? `<img class="champ-equipe-logo" src="${eq.logoBase64}">`
      : `<div class="champ-equipe-logo-ph">🏆</div>`;
    html += `<div class="champ-equipe-card">${logo}
      <div class="champ-equipe-label">🏆 Campeão</div>
      <div class="champ-equipe-nome">${eq?.nome||'—'}</div>
    </div>`;
  }

  const rounds = [...new Set(mm.map(m=>m.rodada))].sort((a,b)=>a-b);
  rounds.forEach(r => {
    const matches = mm.filter(m=>m.rodada===r).sort((a,b)=>a.posicao-b.posicao);
    html += `<div style="margin-bottom:16px;"><div class="round-label">${nomeRodada(r)}</div>`;
    matches.forEach(m => {
      const eq1 = eqs.find(e=>e.id===m.equipe1Id);
      const eq2 = eqs.find(e=>e.id===m.equipe2Id);
      const nome1 = eq1?.nome||(m.equipe1Id?'—':'Aguardando...');
      const nome2 = eq2?.nome||(m.equipe2Id?'—':'Aguardando...');
      const isPend=m.status==='pendente', isDone=m.status==='concluido', isAgt=m.status==='aguardando';
      const v1=isDone&&m.vencedorId===m.equipe1Id, v2=isDone&&m.vencedorId===m.equipe2Id;
      const row = (eq,nome,seed,isV,isW) => `<div class="match-row${isV?' winner':''}">
        ${eqLogo(eq,34)}
        <span class="match-name${isV?' winner-text':isW?' wait-text':''}">${nome}</span>
        ${seedPin(seed)}
        ${isV?`<span class="match-check">✓</span>`:`<span class="match-check-ph"></span>`}
      </div>`;
      html += `<div class="match-card ${isDone?'concluido':isPend?'pendente':''}" style="opacity:${isAgt?.5:1}">
        ${row(eq1,nome1,m.semente1,v1,!eq1&&!m.equipe1Id)}
        <div class="match-vs"><div class="match-vs-line"></div><span class="match-vs-txt">VS</span><div class="match-vs-line"></div>${vsBadge(m.status)}</div>
        ${row(eq2,nome2,m.semente2,v2,!eq2&&!m.equipe2Id)}
      </div>`;
    });
    html += '</div>';
  });
  html += '</div>';
  return html;
}

// ── Render Final Individual ────────────────────────────────────
function renderFinalIndividual(faixa) {
  const fi = (estado.confrontos||[]).filter(c => c.faixa === faixa && c.fase === 'final-individual');
  if (!fi.length) return '';
  const ats = estado.atletas||[], eqs = estado.equipes||[];
  const cats = getCategorias();
  fi.sort((a,b)=>cats.indexOf(a.categoria)-cats.indexOf(b.categoria));

  let html = `<div class="card"><div class="card-header"><h3>🥇 Final Individual por Categoria</h3></div>`;

  // Grid de campeões definidos
  const definidos = fi.filter(m=>m.status==='concluido');
  if (definidos.length) {
    html += `<div class="champ-grid">`;
    definidos.forEach(m => {
      const vAt = ats.find(a=>a.id===m.vencedorId);
      const vEq = eqs.find(e=>e.id===vAt?.equipeId);
      const foto = vAt?.fotoBase64
        ? `<img class="champ-foto" src="${vAt.fotoBase64}" style="margin:0 auto 6px;">`
        : `<div class="champ-foto-ph">🥇</div>`;
      html += `<div class="champ-card">${foto}
        <div class="champ-cat">${m.categoria}</div>
        <div class="champ-nome">${vAt?.nome||'—'}</div>
        <div class="champ-eq">${vEq?.nome||'—'}</div>
      </div>`;
    });
    html += '</div>';
  }

  fi.forEach(m => {
    const at1=ats.find(a=>a.id===m.atleta1Id), at2=ats.find(a=>a.id===m.atleta2Id);
    const eq1=eqs.find(e=>e.id===m.equipe1Id), eq2=eqs.find(e=>e.id===m.equipe2Id);
    const isDone=m.status==='concluido';
    const v1=isDone&&m.vencedorId===m.atleta1Id, v2=isDone&&m.vencedorId===m.atleta2Id;
    const atRow = (at,eq,seed,isV) => `<div class="match-row${isV?' winner':''}">
      ${atFoto(at,34)}
      <div style="flex:1;min-width:0;">
        <div class="match-name${isV?' winner-text':''}">${at?.nome||'—'}</div>
        <div style="display:flex;align-items:center;gap:4px;margin-top:2px;">
          ${eq?.logoBase64?`<img src="${eq.logoBase64}" style="width:14px;height:14px;object-fit:contain;border-radius:3px;">` : ''}
          <span style="font-size:0.65rem;color:#8A9CB0;">${eq?.nome||'—'}</span>
        </div>
      </div>
      ${seedPin(seed)}
      ${isV?`<span class="match-check">🥇</span>`:`<span class="match-check-ph"></span>`}
    </div>`;
    html += `<div style="margin-bottom:12px;">${faseTitle(m.categoria)}
      <div class="match-card ${isDone?'concluido':'pendente'}">
        ${atRow(at1,eq1,1,v1)}
        <div class="match-vs"><div class="match-vs-line"></div><span class="match-vs-txt">VS</span><div class="match-vs-line"></div><span class="match-vs-badge final">🥇 Final</span></div>
        ${atRow(at2,eq2,2,v2)}
      </div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function renderClassificacao() {
  const el = document.getElementById('classificacao-content');
  const fl = FAIXAS_LABEL[faixaAtiva] || faixaAtiva;
  const ranking = calcularClassificacao(faixaAtiva);

  let html = '';

  // ── Classificação por Equipes ──────────────────────────────
  const eqRows = ranking.map((s,i) => {
    const aprov = s.j > 0 ? ((s.pts/(s.j*3))*100).toFixed(0) : 0;
    const logo = s.equipe.logoBase64
      ? `<img src="${s.equipe.logoBase64}" class="eq-logo">`
      : `<span class="eq-logo-ph">🏅</span>`;
    const logoMini = s.equipe.logoBase64
      ? `<img src="${s.equipe.logoBase64}" style="height:22px;width:22px;object-fit:contain;border-radius:3px;flex-shrink:0;">`
      : '';
    // Desktop row
    const tr = `<tr>
      <td><strong>${MEDALS[i]||(i+1)+'º'}</strong></td>
      <td><div style="display:flex;align-items:center">${logo}<div><strong>${s.equipe.nome}</strong><br><span style="font-size:0.65rem;color:#8A9CB0">${s.equipe.cidade||''}</span></div></div></td>
      <td>${s.j}</td><td class="v">${s.v}</td><td class="e">${s.emp}</td><td class="d">${s.d}</td>
      <td><span class="pts">${s.pts}</span></td>
      <td>${s.cv}</td>
      <td><div class="progress-bar"><div class="progress-fill" style="width:${aprov}%"></div></div>${aprov}%</td>
    </tr>`;
    // Mobile card
    const card = `<div class="rank-card">
      <div class="rank-pos">${MEDALS[i]||(i+1)+'º'}</div>
      <div class="rank-body">
        <div class="rank-name">${logoMini}<span>${s.equipe.nome}</span><span class="rank-name-pts">${s.pts} pts</span></div>
        <div class="rank-city">${s.equipe.cidade||''}</div>
        <div class="rank-stats">
          <div class="rs"><span class="rs-lbl">J</span><span class="rs-val">${s.j}</span></div>
          <div class="rs"><span class="rs-lbl">V</span><span class="rs-val v">${s.v}</span></div>
          <div class="rs"><span class="rs-lbl">E</span><span class="rs-val e">${s.emp}</span></div>
          <div class="rs"><span class="rs-lbl">D</span><span class="rs-val d">${s.d}</span></div>
          <div class="rs"><span class="rs-lbl">Cat.V</span><span class="rs-val">${s.cv}</span></div>
        </div>
        <div class="aprov-bar">
          <div class="aprov-track"><div class="aprov-fill" style="width:${aprov}%"></div></div>
          <span class="aprov-pct">${aprov}% aproveit.</span>
        </div>
      </div>
    </div>`;
    return { tr, card };
  });

  html += `<div class="card">
    <div class="card-header"><h3>🏆 Classificação por Equipes — ${fl}</h3></div>
    <div class="tbl-wrap desktop-only"><table>
      <thead><tr>
        <th>Pos</th><th>Equipe</th>
        <th>J</th><th>V</th><th>E</th><th>D</th>
        <th>Pts</th><th>Cat.V</th><th>Aprov.</th>
      </tr></thead>
      <tbody>${eqRows.map(r=>r.tr).join('')}</tbody>
    </table></div>
    <div class="mobile-only">${eqRows.map(r=>r.card).join('')}</div>
  </div>`;

  // ── Ranking Individual por Categoria ──────────────────────
  html += `<div class="card"><div class="card-header"><h3>🥋 Ranking Individual — ${fl}</h3></div>`;

  const cats = getCategorias();
  const zeroSt = { pontos:0, vitorias:0, empates:0, derrotas:0, finalizacoes:0 };
  const getSt = (a, cat) => (a.catStats && a.catStats[cat]) ? a.catStats[cat] : zeroSt;

  cats.forEach(cat => {
    const isAbs = cat === 'Absoluto';
    const ats = (isAbs
      ? estado.equipes.map(eq => getCapitaoAbsoluto(eq.id)).filter(Boolean)
      : estado.atletas.filter(a => a.faixa === faixaAtiva && a.categoria === cat && !a.suplente)
    ).sort((a,b) => {
      const sa = getSt(a,cat), sb = getSt(b,cat);
      return (sb.pontos||0)-(sa.pontos||0)||(sb.vitorias||0)-(sa.vitorias||0);
    });

    if (!ats.length) return;

    const atItems = ats.map((a,i) => {
      const st = getSt(a, cat);
      const foto = a.fotoBase64
        ? `<img src="${a.fotoBase64}" class="atleta-foto">`
        : `<span class="atleta-avatar">👤</span>`;
      const eq = estado.equipes.find(e => e.id === a.equipeId);
      const logoMini = eq?.logoBase64
        ? `<img src="${eq.logoBase64}" style="height:15px;width:15px;object-fit:contain;border-radius:2px;vertical-align:middle;margin-right:4px;">`
        : '';
      const tr = `<tr>
        <td>${MEDALS[i]||(i+1)+'º'}</td>
        <td><div style="display:flex;align-items:center">${foto}<strong>${a.nome}</strong></div></td>
        <td>${logoMini}${nomeEquipe(a.equipeId)}</td>
        ${!isAbs ? `<td style="color:#64748B;font-size:0.72rem">${a.categoria}</td>` : ''}
        <td><span class="pts">${st.pontos||0}</span></td>
        <td class="v">${st.vitorias||0}</td>
        <td class="e">${st.empates||0}</td>
        <td class="d">${st.derrotas||0}</td>
        <td>🔒 ${st.finalizacoes||0}</td>
      </tr>`;
      const fotoMini = a.fotoBase64
        ? `<img src="${a.fotoBase64}" style="width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid #E2E8F0;flex-shrink:0;">`
        : `<span style="display:inline-flex;width:30px;height:30px;border-radius:50%;background:#F1F5F9;border:2px solid #E2E8F0;align-items:center;justify-content:center;font-size:0.75rem;flex-shrink:0;">👤</span>`;
      const card = `<div class="at-card">
        <div class="at-pos">${MEDALS[i]||(i+1)+'º'}</div>
        <div class="at-body">
          <div class="at-name-row">
            ${fotoMini}
            <span class="at-nome">${a.nome}</span>
            <span class="at-pts-badge">${st.pontos||0} pts</span>
          </div>
          <div class="at-eq">${logoMini}${nomeEquipe(a.equipeId)}${!isAbs&&a.categoria?` · ${a.categoria}`:''}</div>
          <div class="at-stats">
            <div class="rs"><span class="rs-lbl">V</span><span class="rs-val v">${st.vitorias||0}</span></div>
            <div class="rs"><span class="rs-lbl">E</span><span class="rs-val e">${st.empates||0}</span></div>
            <div class="rs"><span class="rs-lbl">D</span><span class="rs-val d">${st.derrotas||0}</span></div>
            <div class="rs"><span class="rs-lbl">Fin.</span><span class="rs-val">🔒${st.finalizacoes||0}</span></div>
          </div>
        </div>
      </div>`;
      return { tr, card };
    });

    html += `<div class="cat-section">
      <div class="cat-title">${isAbs ? '🏆 Absoluto (Capitães)' : cat}</div>
      <div class="tbl-wrap desktop-only"><table>
        <thead><tr>
          <th>Pos</th><th>Atleta</th><th>Equipe</th>
          ${!isAbs ? '<th>Cat.</th>' : ''}
          <th>Pts</th><th>V</th><th>E</th><th>D</th><th>Fin.</th>
        </tr></thead>
        <tbody>${atItems.map(r=>r.tr).join('')}</tbody>
      </table></div>
      <div class="mobile-only">${atItems.map(r=>r.card).join('')}</div>
    </div>`;
  });

  html += '</div>';

  // ── Mata-Mata por Equipes ──────────────────────────────────
  html += renderMataMata(faixaAtiva);

  // ── Final Individual por Categoria ─────────────────────────
  html += renderFinalIndividual(faixaAtiva);

  el.innerHTML = html;
}

function aplicarEstado(data) {
  estado = data;
  document.getElementById('hdr-titulo').textContent = `Classificação — ${estado.nomeCompeticao || 'Liga BJJ'}`;
  document.getElementById('banner-nome').textContent = estado.nomeCompeticao || 'Liga BJJ';
  const faixas = estado.ligaConfig?.faixasAtivas || ['branca'];
  if (!faixaAtiva || !faixas.includes(faixaAtiva)) faixaAtiva = faixas[0];
  renderFaixaTabs();
  renderClassificacao();
}

if (!campeonatoId) {
  document.getElementById('classificacao-content').innerHTML =
    `<div class="vazio"><span>⚠️</span><p>ID da competição não informado na URL.</p></div>`;
} else {
  // Tenta localStorage primeiro (mesmo browser que o admin)
  const local = localStorage.getItem(`gaditas_liga_${campeonatoId}`);
  if (local) {
    try { aplicarEstado(JSON.parse(local)); } catch(e) {}
  }

  // Firestore onSnapshot para sync em tempo real (todos os browsers)
  onSnapshot(doc(_db, "campeonatos", campeonatoId, "liga-config", "estado-publico"), snap => {
    if (snap.exists()) {
      const data = snap.data();
      localStorage.setItem(`gaditas_liga_${campeonatoId}`, JSON.stringify(data));
      aplicarEstado(data);
    } else {
      document.getElementById('classificacao-content').innerHTML =
        `<div class="vazio"><span>📋</span><p>Classificação ainda não disponível.</p></div>`;
    }
  });
}
</script>
<script src="js/install-prompt.js"></script>
